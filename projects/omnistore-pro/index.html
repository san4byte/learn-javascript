<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniStore Pro — Katalog Produk</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body
    class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col"
  >
    <!-- Navbar -->
    <header
      class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs"
    >
      <div
        class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4"
      >
        <a href="/" class="text-xl font-black text-emerald-600 tracking-tight"
          >OmniStore<span class="text-slate-800">.</span></a
        >

        <!-- Input Search dengan Debounce -->
        <div class="flex-1 max-w-md">
          <input
            id="search-input"
            type="text"
            placeholder="Cari laptop, smartphone, sepatu..."
            class="w-full bg-slate-100 border border-transparent focus:border-emerald-500 focus:bg-white rounded-xl px-4 py-2 text-sm outline-none transition"
          />
        </div>

        <!-- Tombol Keranjang -->
        <button
          id="btn-cart-toggle"
          class="relative p-2.5 rounded-xl hover:bg-slate-100 transition cursor-pointer"
        >
          🛒
          <span
            id="cart-badge"
            class="absolute -top-1 -right-1 bg-emerald-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center"
            >0</span
          >
        </button>
      </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
      <!-- Filter Kategori -->
      <div
        id="category-chips"
        class="flex gap-2 overflow-x-auto pb-4 mb-6"
      ></div>

      <!-- Grid Produk -->
      <div
        id="product-grid"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      ></div>

      <!-- Sentinel Elemen untuk Infinite Scroll -->
      <div
        id="scroll-sentinel"
        class="h-10 mt-8 flex items-center justify-center text-slate-400 text-sm"
      >
        <span>Memuat lebih banyak produk...</span>
      </div>
    </main>

    <!-- Cart Drawer / Modal Samping -->
    <div
      id="cart-modal"
      class="fixed inset-0 z-50 overflow-hidden hidden"
      aria-labelledby="slide-over-title"
      role="dialog"
      aria-modal="true"
    >
      <!-- Backdrop Gelap -->
      <div
        id="cart-backdrop"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs transition-opacity"
      ></div>

      <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
        <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
          <!-- Header Keranjang -->
          <div
            class="p-6 border-b border-slate-100 flex items-center justify-between"
          >
            <div class="flex items-center gap-2">
              <h2 class="text-lg font-black text-slate-800">
                Keranjang Belanja
              </h2>
              <span
                id="cart-drawer-count"
                class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-0.5 rounded-full"
                >0 item</span
              >
            </div>
            <button
              id="btn-close-cart"
              class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-xl transition cursor-pointer"
            >
              ✕
            </button>
          </div>

          <!-- Body / List Barang Belanjaan -->
          <div
            id="cart-items-container"
            class="flex-1 overflow-y-auto p-6 divide-y divide-slate-100"
          >
            <!-- Konten barang akan dirender di sini lewat JS -->
          </div>

          <!-- Footer / Ringkasan Pembayaran & Tombol Checkout -->
          <div
            class="p-6 border-t border-slate-100 bg-slate-50/50 flex flex-col gap-4"
          >
            <div class="flex items-center justify-between">
              <span class="text-sm text-slate-500 font-medium"
                >Total Tagihan</span
              >
              <span
                id="cart-total-price"
                class="text-xl font-black text-emerald-600"
                >Rp 0</span
              >
            </div>

            <button
              id="btn-checkout"
              class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl shadow-xs transition cursor-pointer flex items-center justify-center gap-2"
            >
              Checkout Sekarang
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
