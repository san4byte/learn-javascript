<!doctype html>
<html lang="id" class="bg-slate-900">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Kalkulator Sakti - MPA Vite</title>
  </head>
  <body
    class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6"
  >
    <div
      class="max-w-md w-full bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 space-y-6"
    >
      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-indigo-400">
          🧮 Kalkulator Sakti
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Modular Service dengan Validasi Input
        </p>
      </div>

      <!-- Kotak Alert Error (Awalnya tersembunyi dengan class 'hidden') -->
      <div
        id="error"
        class="hidden bg-rose-500/10 border border-rose-500 text-rose-400 px-4 py-3 rounded-lg text-sm font-medium"
      ></div>

      <!-- Formulir Input -->
      <div class="space-y-4">
        <div>
          <label
            class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider"
            >Angka Pertama</label
          >
          <input
            type="text"
            id="operand1"
            placeholder="Masukkan angka..."
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
          />
        </div>

        <div>
          <label
            class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider"
            >Angka Kedua</label
          >
          <input
            type="text"
            id="operand2"
            placeholder="Masukkan angka..."
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
          />
        </div>

        <button
          type="button"
          id="tombol-tambah"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-indigo-600/30 transition"
        >
          Jumlahkan! ➕
        </button>
      </div>

      <!-- Hasil Perhitungan -->
      <div
        class="bg-slate-900/60 border border-slate-700/60 p-4 rounded-xl text-center"
      >
        <span class="text-xs text-slate-400 block uppercase font-medium"
          >Hasil Penjumlahan:</span
        >
        <span
          id="hasil"
          class="text-3xl font-extrabold text-indigo-400 mt-1 block"
          >-</span
        >
      </div>

      <!-- Link Navigasi -->
      <div class="pt-4 border-t border-slate-700 text-center">
        <a
          href="/"
          class="text-slate-400 hover:text-white underline text-sm transition"
        >
          ⬅️ Kembali ke Dashboard
        </a>
      </div>
    </div>

    <!-- Script khusus halaman kalkulator -->
    <script type="module" src="/src/calculator-page.js"></script>
  </body>
</html>
