<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>07 - HTML Form Elements</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; }
    input[type="text"] { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; background: #2563eb; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .result { margin-top: 1.5rem; padding: 1rem; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <h1>Manipulasi HTML Form Elements</h1>
  <form id="comment-form">
    <div class="form-group">
      <label for="nama">Nama:</label>
      <input type="text" id="nama" name="nama" required>
    </div>
    <div class="form-group">
      <label for="pesan">Pesan Komentar:</label>
      <input type="text" id="pesan" name="pesan" required>
    </div>
    <button type="submit" id="btn-kirim">Kirim Komentar</button>
  </form>

  <div id="output" class="result"></div>
  <script src="example.js"></script>
</body>
</html>
