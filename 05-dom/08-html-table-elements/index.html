<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>08 - HTML Table Elements</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        max-width: 680px;
        margin: 30px auto;
        padding: 0 20px;
        color: #1e293b;
        line-height: 1.6;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-add {
        background-color: #059669;
        color: white;
      }
      .btn-del {
        background-color: #dc2626;
        color: white;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #cbd5e1;
      }
      th,
      td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
      }
      th {
        background-color: #f1f5f9;
        font-weight: 600;
        color: #334155;
      }
      tr:hover td {
        background-color: #f8fafc;
      }
      .btn-row-del {
        background: none;
        color: #ef4444;
        border: 1px solid #fca5a5;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.8rem;
      }
      .btn-row-del:hover {
        background: #fee2e2;
      }
      tfoot td {
        background: #f8fafc;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>08 - HTML Table Elements</h1>
    <p>
      Manipulasi struktur tabel dinamis menggunakan API bawaan
      <code>HTMLTableElement</code>.
    </p>

    <div class="toolbar">
      <button id="btn-tambah" class="btn-add">+ Tambah Siswa</button>
      <button id="btn-hapus-akhir" class="btn-del">
        - Hapus Baris Terakhir
      </button>
    </div>

    <table id="tabel-siswa">
      <thead>
        <tr>
          <th style="width: 50px">No</th>
          <th>Nama Siswa</th>
          <th>Nilai</th>
          <th style="width: 80px">Aksi</th>
        </tr>
      </thead>
      <tbody id="tabel-body">
        <tr>
          <td>1</td>
          <td>Budi Santoso</td>
          <td>90</td>
          <td><button class="btn-row-del">Hapus</button></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4" id="info-total">Total Siswa: 1 Orang</td>
        </tr>
      </tfoot>
    </table>

    <script src="./example.js"></script>
  </body>
</html>
