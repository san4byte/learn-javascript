<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01 - Pengenalan DOM & DOM Tree</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        max-width: 680px;
        margin: 40px auto;
        line-height: 1.6;
        padding: 0 20px;
        color: #1e293b;
      }
      .card {
        padding: 16px 20px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #f8fafc;
        margin-top: 16px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        background: #dbeafe;
        color: #1d4ed8;
        border-radius: 4px;
        font-size: 0.85rem;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1 id="judul-halaman">01 - Pengenalan DOM &amp; DOM Tree</h1>
    <p id="deskripsi-materi">
      Document Object Model (DOM) merepresentasikan halaman web sebagai pohon
      objek (DOM Tree) di memori browser.
    </p>

    <div class="card" id="kotak-info">
      <span class="badge">Node Tree Preview</span>
      <ul id="daftar-node">
        <li class="item-node">Document Node (Root)</li>
        <li class="item-node">
          Element Node (&lt;html&gt;, &lt;body&gt;, &lt;p&gt;)
        </li>
        <li class="item-node">Text Node (Teks di dalam elemen)</li>
      </ul>
    </div>

    <!-- Script diletakkan sebelum penutup </body> agar DOM selesai dibangun -->
    <script src="./example.js"></script>
  </body>
</html>
