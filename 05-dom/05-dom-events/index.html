<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05 - DOM Events</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        max-width: 680px;
        margin: 30px auto;
        padding: 0 20px;
        color: #1e293b;
        line-height: 1.6;
      }
      .panel {
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        padding: 16px 20px;
        margin-bottom: 20px;
        background: #f8fafc;
      }
      .interactive-btn {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .interactive-btn:hover {
        background-color: #1d4ed8;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 1rem;
      }
      .hover-box {
        padding: 24px;
        border: 2px dashed #94a3b8;
        border-radius: 8px;
        text-align: center;
        background-color: white;
        transition: all 0.3s;
      }
      .box-hovered {
        background-color: #dbeafe !important;
        border-color: #3b82f6 !important;
      }
      .log-box {
        background: #0f172a;
        color: #38bdf8;
        padding: 12px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 0.85rem;
        min-height: 60px;
      }
    </style>
  </head>
  <body>
    <h1 id="judul-halaman">05 - DOM Events</h1>
    <p>
      Uji responsivitas interaksi mouse, keyboard, dan manipulasi antarmuka
      melalui event handler.
    </p>

    <!-- Panel 1: Event Klik & Penghitung -->
    <div class="panel">
      <h3>1. Mouse Click Event</h3>
      <button id="btn-klik" class="interactive-btn">Klik Saya! (0x)</button>
      <button
        id="btn-sekali"
        class="interactive-btn"
        style="background-color: #059669"
      >
        Tombol Sekali Pakai ({ once: true })
      </button>
    </div>

    <!-- Panel 2: Keyboard Event Input -->
    <div class="panel">
      <h3>2. Keyboard Event (keyup & keydown)</h3>
      <input
        type="text"
        id="input-teks"
        placeholder="Ketik sesuatu di sini..."
      />
      <p>
        Karakter Terakhir Ditekan:
        <span id="info-key" style="font-weight: bold; color: #2563eb">-</span>
      </p>
    </div>

    <!-- Panel 3: Mouse Hover Box -->
    <div class="panel">
      <h3>3. Mouse Move & Hover (mouseenter & mouseleave)</h3>
      <div id="kotak-hover" class="hover-box">
        Arahkan kursor mouse ke area kotak ini
      </div>
    </div>

    <script src="./example.js"></script>
  </body>
</html>
