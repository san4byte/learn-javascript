<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04 - AJAX XMLHttpRequest</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        max-width: 650px;
        margin: 30px auto;
        padding: 0 20px;
        color: #1e293b;
        line-height: 1.6;
      }
      button {
        padding: 10px 18px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background-color: #1d4ed8;
      }
      pre {
        background-color: #0f172a;
        color: #38bdf8;
        padding: 16px;
        border-radius: 8px;
        font-size: 0.9rem;
        overflow-x: auto;
        min-height: 80px;
      }
    </style>
  </head>
  <body>
    <h1>04 - AJAX (XMLHttpRequest)</h1>
    <p>
      Pengambilan data asinkron latar belakang tanpa refresh menggunakan objek
      klasik XHR.
    </p>
    <button id="btn-request">Ambil Data via AJAX</button>
    <pre id="output">// Data JSON dari server akan tampil di sini...</pre>

    <script src="example.js"></script>
  </body>
</html>
